name: Update Contribution Graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime

          username = os.environ["USERNAME"]
          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays { contributionCount date }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-contribution-graph"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          user = data["data"]["user"]
          if not user:
              raise SystemExit("GitHub user not found")

          weeks = user["contributionsCollection"]["contributionCalendar"]["weeks"]

          width = 850
          height = 170
          left = 28
          top = 48
          cell = 12
          gap = 3

          counts = [
              day["contributionCount"]
              for week in weeks
              for day in week["contributionDays"]
          ]
          max_count = max(counts) if counts else 1

          def level(count):
              if count == 0:
                  return "#161b22"
              ratio = count / max_count
              if ratio <= 0.25: return "#0e4429"
              if ratio <= 0.50: return "#006d32"
              if ratio <= 0.75: return "#26a641"
              return "#39d353"

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="10" fill="#0d1117"/>',
              '<text x="28" y="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Contribution Graph</text>'
          ]

          for x, week in enumerate(weeks[-53:]):
              for y, day in enumerate(week["contributionDays"]):
                  rx = left + x * (cell + gap)
                  ry = top + y * (cell + gap)
                  parts.append(
                      f'<rect x="{rx}" y="{ry}" width="{cell}" height="{cell}" rx="2" fill="{level(day["contributionCount"])}">'
                      f'<title>{day["date"]}: {day["contributionCount"]} contributions</title></rect>'
                  )

          parts.append('<text x="28" y="160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Less</text>')
          for i, color in enumerate(["#161b22","#0e4429","#006d32","#26a641","#39d353"]):
              parts.append(f'<rect x="{57 + i*16}" y="152" width="12" height="12" rx="2" fill="{color}"/>')
          parts.append('<text x="139" y="160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#8b949e">More</text>')
          parts.append("</svg>")

          os.makedirs("assets", exist_ok=True)
          with open("assets/contribution-graph.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(parts))
          PY

      - name: Publish graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git diff --cached --quiet && exit 0
          git commit -m "update contribution graph"
          git push origin HEAD:output
